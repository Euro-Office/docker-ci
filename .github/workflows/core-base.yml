name: Build and push core-base

# Builds the core-base stage of core/.docker/core.bake.Dockerfile, so the image
# never drifts from core. Core CI pulls ghcr.io/euro-office/core-base:<product>-<arch>-<hash>,
# where <hash> is the first 12 characters of the Dockerfile's sha256, and builds the
# stage itself when that tag is not published yet.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      core_ref:
        description: Ref of Euro-Office/core to build
        default: main
      force:
        description: Rebuild although the tag exists
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: euro-office/core-base

jobs:
  build-and-push:
    name: ${{ matrix.product }}-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        product: [server, desktop]
        arch: [amd64, arm64]

    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: Euro-Office/core
          ref: ${{ inputs.core_ref || 'main' }}
          sparse-checkout: .docker/core.bake.Dockerfile
          path: core

      - name: Name the image after the Dockerfile
        id: tag
        run: |
          mkdir empty-context
          hash=$(sha256sum core/.docker/core.bake.Dockerfile | cut -c1-12)
          echo "name=${{ matrix.product }}-${{ matrix.arch }}-$hash" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether it is published
        id: exists
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.published == 'false' || inputs.force
        uses: docker/setup-buildx-action@v3

      # The stage has no COPY, so an empty directory is enough as context.
      - name: Build and push
        if: steps.exists.outputs.published == 'false' || inputs.force
        uses: docker/build-push-action@v6
        with:
          context: empty-context
          file: core/.docker/core.bake.Dockerfile
          target: core-base
          platforms: linux/${{ matrix.arch }}
          build-args: PRODUCT=${{ matrix.product }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.product }}-${{ matrix.arch }}-latest
          cache-from: type=gha,scope=core-base-${{ matrix.product }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-base-${{ matrix.product }}-${{ matrix.arch }}
