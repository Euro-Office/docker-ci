name: Mirror emscripten/emsdk

# Mirrors upstream emscripten/emsdk tags into GHCR so CI does not depend on
# Docker Hub availability (which periodically returns 502 Bad Gateway).
#
# This is a pure manifest copy (docker buildx imagetools create), so the
# mirrored image keeps the same digests and platforms as upstream - it is not
# rebuilt from a Dockerfile.

on:
  schedule:
    # Weekly, Monday 04:00 UTC. Refreshes moving tags (e.g. latest) and
    # re-copies pinned tags in case the GHCR copy was pruned.
    - cron: '0 4 * * 1'
  push:
    branches:
      - main
    paths:
      - emsdk-mirror/**
      - .github/workflows/emsdk-mirror.yml
  workflow_dispatch:
    inputs:
      tag:
        description: 'Single tag to mirror on demand (overrides tags.txt)'
        required: false

env:
  REGISTRY: ghcr.io
  SOURCE_IMAGE: emscripten/emsdk
  TARGET_IMAGE: euro-office/emsdk

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag list
        id: tags
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tags=$(printf '%s\n' "$INPUT_TAG" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            tags=$(grep -vE '^\s*(#|$)' emsdk-mirror/tags.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Mirroring tags: $tags"

  mirror:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.prepare.outputs.tags) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror ${{ env.SOURCE_IMAGE }}:${{ matrix.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${TARGET_IMAGE}:${{ matrix.tag }}" \
            "${SOURCE_IMAGE}:${{ matrix.tag }}"
